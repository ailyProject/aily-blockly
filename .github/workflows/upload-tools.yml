name: Upload tool regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'child/scripts/**'
      - 'tests/upload-*.test.cjs'
      - 'tests/platform-resource-roots.test.cjs'
      - 'tests/versioned-platform-resource.test.cjs'
      - 'tests/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/upload-tools.yml'

permissions:
  contents: read

jobs:
  upload-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix tests run test:upload-tools
