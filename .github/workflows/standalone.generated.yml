name: Standalone Build
"on": 
  workflow_dispatch: 
    {}
jobs: 
  build: 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: 
          node-version: lts/*
      - uses: pnpm/action-setup@v6
        with: 
          version: 11.7.0
          run_install: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: "printf '\\ntrustLockfile: true\\n' >> pnpm-workspace.yaml\npnpm install --frozen-lockfile"
      - name: Build shared/core/ui
        run: "pnpm --filter \"./packages/shared\" run build\npnpm --filter \"./packages/core\" run build\npnpm --filter \"./packages/ui\" run build"
