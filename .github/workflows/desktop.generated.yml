name: Desktop Build
"on": 
  workflow_dispatch: 
    {}
jobs: 
  build: 
    if: "${{ github.ref == 'refs/heads/xwd-experimental' }}"
    runs-on: macos-latest
    steps: 
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: 
          node-version: lts/*
      - uses: pnpm/action-setup@v6
        with: 
          version: 11.7.0
          run_install: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: "printf '\\ntrustLockfile: true\\n' >> pnpm-workspace.yaml\npnpm install --frozen-lockfile"
      - name: Build workspaces
        run: "pnpm --filter \"./packages/erpc\" run build\npnpm --filter \"./packages/shared\" run build\npnpm --filter \"./packages/core\" run build\npnpm --filter \"./packages/ui\" run build\npnpm --filter \"./packages/desktop\" run build"
      - name: Package desktop
        run: "pnpm turbo run desktop#pack:mac\npnpm turbo run desktop#pack:win"
