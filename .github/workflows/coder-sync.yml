name: Aily Coder Sync

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Aily Coder Package run ID on deploy-coder
        required: true
        type: string
      use_r2:
        description: Recover this release from R2 when its Actions artifacts have expired
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  sync-stable-feed:
    if: github.ref == 'refs/heads/deploy-coder'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish domestic Coder feed
        uses: ./.github/actions/publish-coder-feed
        env:
          FEED_PORT: ${{ vars.DOMESTIC_FEED_SSH_PORT || '22' }}
          STAGING_ROOT: ${{ vars.DOMESTIC_FEED_STAGING_ROOT }}
          PUBLIC_DIR: ${{ vars.DOMESTIC_FEED_PUBLIC_DIR }}
          VERIFY_URL: ${{ vars.DOMESTIC_FEED_VERIFY_URL || 'https://dl.yiyu.pro/blockly' }}
        with:
          source-run-id: ${{ inputs.source_run_id }}
          use-r2: ${{ inputs.use_r2 }}
          ssh-host: ${{ secrets.TRIGGER_SERVER_HOST }}
          ssh-user: ${{ secrets.TRIGGER_SERVER_USER }}
          ssh-password: ${{ secrets.TRIGGER_SERVER_PASSWORD }}
          known-hosts: ${{ secrets.DOMESTIC_FEED_KNOWN_HOSTS }}
