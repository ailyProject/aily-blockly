name: CI & CD Pipeline

on:
  push:
    branches:
      - deploy
      - beta
  workflow_dispatch:

concurrency:
  group: aily-blockly-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Blockly release branch and version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (process.env.RELEASE_REF_TYPE !== 'branch' || !['deploy', 'beta'].includes(process.env.RELEASE_BRANCH)) {
            throw new Error('Blockly releases require the deploy or beta branch');
          }
          const { version } = require('./package.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

  # 任务 1：Windows 国际版客户端构建
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Cache child resources
        uses: actions/cache@v4
        with:
          path: .aily/child-cache
          key: child-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/child-resources.lock.json') }}

      - name: Install Dependencies
        run: |
          npm install -g @angular/cli
          npm ci --include=dev
          cd electron && npm ci --include=dev --force

      - name: Build Windows Package (Global)
        run: |
          npm run build:global
        env:
          NODE_ENV: production

      # ================== SignPath 签名流程 ==================
      
      - name: Upload Unsigned Installer for Signing
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-global
          path: dist/aily-blockly/*.exe
          overwrite: true
          if-no-files-found: error

      - name: Sign Installer with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'bd01a768-a9e3-4a62-945d-fcfdc37a299e'
          project-slug: 'aily-blockly' 
          signing-policy-slug: ${{ github.ref_name == 'beta' && 'test-signing' || 'release-signing' }}
          github-artifact-id: '${{ steps.upload_unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist/aily-blockly'

      # 删除签名前生成的 blockmap 文件（签名后 exe 内容已变，blockmap 中的 SHA256 分块校验会失败）
      - name: Remove stale blockmap files
        run: |
          Remove-Item -Path "dist/aily-blockly/*.blockmap" -Force -ErrorAction SilentlyContinue
          Write-Host "✓ Removed stale blockmap files"

      # 重新生成 latest.yml（使用签名后的 exe hash）
      - name: Regenerate latest.yml with signed exe hash
        run: |
          cd dist/aily-blockly
          
          # 列出目录文件（调试用）
          Write-Host "Files in dist/aily-blockly:"
          Get-ChildItem -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          
          # 获取签名后的 exe 文件（优先匹配安装包命名模式）
          $exeFile = Get-ChildItem -Filter "aily-blockly-Setup-*.exe" | Select-Object -First 1
          if (-not $exeFile) {
            $exeFile = Get-ChildItem -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $exeFile) {
            Write-Error "No exe file found in dist/aily-blockly!"
            exit 1
          }
          $exeSize = $exeFile.Length
          $exeName = $exeFile.Name
          
          Write-Host "✓ Signed exe: $exeName ($exeSize bytes)"
          
          # 计算签名后的 SHA512 hash（base64格式）
          $hash = Get-FileHash -Path $exeFile.FullName -Algorithm SHA512
          $hashBytes = [System.Convert]::FromHexString($hash.Hash)
          $sha512Base64 = [System.Convert]::ToBase64String($hashBytes)
          
          Write-Host "✓ SHA512: $sha512Base64"
          Write-Host "✓ SHA512 length: $($sha512Base64.Length) chars"
          
          # 从 package.json 读取版本号
          $packageJson = Get-Content "../../package.json" -Raw | ConvertFrom-Json
          $version = $packageJson.version
          
          # 获取发布日期（ISO 8601格式）
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          
          # 生成 latest.yml 内容（使用字符串拼接 + LF 换行符，避免 here-string 缩进问题）
          $lf = "`n"
          $content = "version: $version" + $lf +
                     "files:" + $lf +
                     "  - url: $exeName" + $lf +
                     "    sha512: $sha512Base64" + $lf +
                     "    size: $exeSize" + $lf +
                     "path: $exeName" + $lf +
                     "sha512: $sha512Base64" + $lf +
                     "releaseDate: '$releaseDate'" + $lf
          
          # 使用 .NET API 直接写入（确保 UTF-8 无 BOM，LF 换行符）
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "latest.yml"),
            $content,
            $utf8NoBom
          )
          
          Write-Host "✓ latest.yml regenerated with signed exe hash"
          Write-Host ""
          Write-Host "Content:"
          Get-Content "latest.yml"
          
          # 验证写入结果
          $verify = [System.IO.File]::ReadAllText((Join-Path $PWD "latest.yml"))
          if ($verify -notmatch [regex]::Escape($sha512Base64)) {
            Write-Error "Verification FAILED: sha512 not found in generated latest.yml!"
            Write-Host "Expected sha512: $sha512Base64"
            exit 1
          }
          Write-Host "✓ Verification passed: sha512 matches in latest.yml"

      # ================== SignPath 签名流程结束 ==================

      - name: Archive Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AilyBlockly-Windows-Package
          path: dist/aily-blockly/
          overwrite: true
          if-no-files-found: error

  # 任务 1b：Windows 国内版客户端构建
  build-windows-cn:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Cache child resources
        uses: actions/cache@v4
        with:
          path: .aily/child-cache
          key: child-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/child-resources.lock.json') }}

      - name: Install Dependencies
        run: |
          npm install -g @angular/cli
          npm ci --include=dev
          cd electron && npm ci --include=dev --force

      - name: Build Windows Package (CN)
        run: |
          npm run build:cn
        env:
          NODE_ENV: production

      - name: Upload Unsigned Installer for Signing (CN)
        id: upload_unsigned_cn
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-cn
          path: dist/aily-blockly/*.exe
          overwrite: true
          if-no-files-found: error

      - name: Sign Installer with SignPath (CN)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'bd01a768-a9e3-4a62-945d-fcfdc37a299e'
          project-slug: 'aily-blockly'
          signing-policy-slug: ${{ github.ref_name == 'beta' && 'test-signing' || 'release-signing' }}
          github-artifact-id: '${{ steps.upload_unsigned_cn.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist/aily-blockly'

      - name: Remove stale blockmap files (CN)
        run: |
          Remove-Item -Path "dist/aily-blockly/*.blockmap" -Force -ErrorAction SilentlyContinue
          Write-Host "✓ Removed stale blockmap files"

      - name: Regenerate latest.yml with signed exe hash (CN)
        run: |
          cd dist/aily-blockly

          Write-Host "Files in dist/aily-blockly:"
          Get-ChildItem -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

          $exeFile = Get-ChildItem -Filter "aily-blockly-CN-Setup-*.exe" | Select-Object -First 1
          if (-not $exeFile) {
            $exeFile = Get-ChildItem -Filter "*.exe" | Select-Object -First 1
          }
          if (-not $exeFile) {
            Write-Error "No exe file found in dist/aily-blockly!"
            exit 1
          }
          $exeSize = $exeFile.Length
          $exeName = $exeFile.Name

          Write-Host "✓ Signed exe: $exeName ($exeSize bytes)"

          $hash = Get-FileHash -Path $exeFile.FullName -Algorithm SHA512
          $hashBytes = [System.Convert]::FromHexString($hash.Hash)
          $sha512Base64 = [System.Convert]::ToBase64String($hashBytes)

          Write-Host "✓ SHA512: $sha512Base64"
          Write-Host "✓ SHA512 length: $($sha512Base64.Length) chars"

          $packageJson = Get-Content "../../package.json" -Raw | ConvertFrom-Json
          $version = $packageJson.version
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          $lf = "`n"
          $content = "version: $version" + $lf +
                     "files:" + $lf +
                     "  - url: $exeName" + $lf +
                     "    sha512: $sha512Base64" + $lf +
                     "    size: $exeSize" + $lf +
                     "path: $exeName" + $lf +
                     "sha512: $sha512Base64" + $lf +
                     "releaseDate: '$releaseDate'" + $lf

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "latest-cn.yml"),
            $content,
            $utf8NoBom
          )

          Write-Host "✓ latest-cn.yml regenerated with signed exe hash"
          Write-Host ""
          Write-Host "Content:"
          Get-Content "latest-cn.yml"

          $verify = [System.IO.File]::ReadAllText((Join-Path $PWD "latest-cn.yml"))
          if ($verify -notmatch [regex]::Escape($sha512Base64)) {
            Write-Error "Verification FAILED: sha512 not found in generated latest-cn.yml!"
            Write-Host "Expected sha512: $sha512Base64"
            exit 1
          }
          Write-Host "✓ Verification passed: sha512 matches in latest-cn.yml"

      - name: Archive Windows Artifact (CN)
        uses: actions/upload-artifact@v4
        with:
          name: AilyBlockly-Windows-Package-cn
          path: dist/aily-blockly/
          overwrite: true
          if-no-files-found: error
  
  # 任务 2：macOS 客户端构建
  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Cache child resources
        uses: actions/cache@v4
        with:
          path: .aily/child-cache
          key: child-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/child-resources.lock.json') }}

      - name: Install Dependencies
        run: |
          npm install -g @angular/cli
          npm ci --include=dev
          cd electron && npm ci --include=dev --force

      # --- 导入代码签名证书到 Keychain ---
      - name: Import Codesign Certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_SIGNING_PASSWORD }}

      - name: Verify Certificate Import
        run: |
          echo "Available signing identities:"
          security find-identity -v -p codesigning
          echo ""
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -n 1)
          if [ -z "$IDENTITY" ]; then
            echo "❌ No Developer ID Application certificate found!"
            exit 1
          else
            echo "✅ Found: $IDENTITY"
          fi

      # --- 构建 + 签名 + 公证（仅构建 arm64）---
      - name: Build, Sign & Notarize
        run: |
          npm run build:global
        env:
          NODE_ENV: production
          # 签名复用前一步导入的 Keychain 证书；不要设置 CSC_LINK 触发重复导入。
          # Apple 公证配置（electron-builder 要求的变量名）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --- 如果 electron-builder 公证失败，手动公证（处理 arm64 和 x64 两个 DMG）---
      - name: Manual Notarization (if needed)
        if: success() || failure()
        run: |
          DMG_FILES=$(find dist/aily-blockly -name "*.dmg" -type f)
          
          if [ -z "$DMG_FILES" ]; then
            echo "❌ DMG not found!"
            exit 1
          fi
          
          while IFS= read -r DMG_PATH; do
            echo "=== Processing: $DMG_PATH ==="
            
            echo "Checking if already notarized..."
            if xcrun stapler validate "$DMG_PATH" 2>/dev/null; then
              echo "✅ Already notarized and stapled: $DMG_PATH"
              continue
            fi
            
            echo "Submitting for notarization: $DMG_PATH"
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --wait \
              --timeout 30m
            
            echo "Stapling..."
            xcrun stapler staple "$DMG_PATH"
            echo "✅ Notarization completed: $DMG_PATH"
          done <<< "$DMG_FILES"

      - name: Final Verification
        run: |
          echo "=== Verification ==="
          while IFS= read -r DMG_PATH; do
            xcrun stapler validate "$DMG_PATH" && echo "✅ Notarized: $DMG_PATH" || echo "⚠️ Not notarized: $DMG_PATH"
          done < <(find dist/aily-blockly -name "*.dmg" -type f)
      
      - name: Refresh DMG update metadata after stapling
        run: |
          for manifest in dist/aily-blockly/*-mac.yml; do
            node scripts/refresh-macos-dmg-manifest.cjs "$manifest"
          done

      - name: Archive macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AilyBlockly-macOS-Package
          path: dist/aily-blockly/
          overwrite: true
          if-no-files-found: error

  # 任务 2b：macOS 国内版客户端构建
  build-macos-cn:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Cache child resources
        uses: actions/cache@v4
        with:
          path: .aily/child-cache
          key: child-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/child-resources.lock.json') }}

      - name: Install Dependencies
        run: |
          npm install -g @angular/cli
          npm ci --include=dev
          cd electron && npm ci --include=dev --force

      - name: Import Codesign Certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_SIGNING_PASSWORD }}

      - name: Verify Certificate Import
        run: |
          echo "Available signing identities:"
          security find-identity -v -p codesigning
          echo ""
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -n 1)
          if [ -z "$IDENTITY" ]; then
            echo "❌ No Developer ID Application certificate found!"
            exit 1
          else
            echo "✅ Found: $IDENTITY"
          fi

      - name: Build, Sign & Notarize (CN)
        run: |
          npm run build:cn
        env:
          NODE_ENV: production
          # 签名复用前一步导入的 Keychain 证书；不要设置 CSC_LINK 触发重复导入。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Manual Notarization (if needed) (CN)
        if: success() || failure()
        run: |
          DMG_FILES=$(find dist/aily-blockly -name "aily-blockly-CN-*.dmg" -type f)

          if [ -z "$DMG_FILES" ]; then
            echo "❌ CN DMG not found!"
            exit 1
          fi

          while IFS= read -r DMG_PATH; do
            echo "=== Processing: $DMG_PATH ==="

            echo "Checking if already notarized..."
            if xcrun stapler validate "$DMG_PATH" 2>/dev/null; then
              echo "✅ Already notarized and stapled: $DMG_PATH"
              continue
            fi

            echo "Submitting for notarization: $DMG_PATH"
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --wait \
              --timeout 30m

            echo "Stapling..."
            xcrun stapler staple "$DMG_PATH"
            echo "✅ Notarization completed: $DMG_PATH"
          done <<< "$DMG_FILES"

      - name: Final Verification (CN)
        run: |
          echo "=== Verification ==="
          while IFS= read -r DMG_PATH; do
            xcrun stapler validate "$DMG_PATH" && echo "✅ Notarized: $DMG_PATH" || echo "⚠️ Not notarized: $DMG_PATH"
          done < <(find dist/aily-blockly -name "aily-blockly-CN-*.dmg" -type f)

      - name: Refresh DMG update metadata after stapling (CN)
        run: |
          for manifest in dist/aily-blockly/*-mac.yml; do
            node scripts/refresh-macos-dmg-manifest.cjs "$manifest"
          done

      - name: Rename latest-mac manifest (CN)
        run: |
          if [ -f "dist/aily-blockly/latest-mac.yml" ]; then
            mv "dist/aily-blockly/latest-mac.yml" "dist/aily-blockly/latest-mac-cn.yml"
            echo "✓ latest-mac-cn.yml generated"
          else
            echo "❌ latest-mac.yml not found after cn mac build"
            exit 1
          fi

      - name: Archive macOS Artifact (CN)
        uses: actions/upload-artifact@v4
        with:
          name: AilyBlockly-macOS-Package-cn
          path: dist/aily-blockly/
          overwrite: true
          if-no-files-found: error

  # 在发布前固定日志，重试发布时复用同一份内容。
  prepare-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git 历史，用于对比 tag 生成 changelog

      - name: Get Git Commits Since Last Release
        id: commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BASE_SHA=""

          # 策略1：从 release-meta 分支读取上次记录的 commit SHA（精确范围）
          echo "--- 尝试从 release-meta 分支读取上次发布的 SHA ---"
          git fetch origin release-meta 2>/dev/null || true
          if git ls-remote --heads origin release-meta 2>/dev/null | grep -q release-meta; then
            STORED_SHA=$(git show "origin/release-meta:last-sha-${BRANCH_NAME}" 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -n "$STORED_SHA" ]; then
              echo "✓ 读取到上次发布 SHA: $STORED_SHA"
              if git cat-file -e "${STORED_SHA}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$STORED_SHA" HEAD 2>/dev/null; then
                echo "✓ SHA 有效，作为 changelog 起始点"
                BASE_SHA="$STORED_SHA"
              else
                echo "⚠️ 存储的 SHA 不在当前历史中（可能因 force-push/rebase），降级到 tag 策略"
              fi
            else
              echo "⚠️ release-meta 分支中 last-sha-${BRANCH_NAME} 不存在或为空，降级到 tag 策略"
            fi
          else
            echo "⚠️ release-meta 分支不存在（首次发布），降级到 tag 策略"
          fi

          # 策略2（降级）：通过 GitHub API 获取上一个 Release tag
          if [ -z "$BASE_SHA" ]; then
            CURRENT_TAG="${{ needs.prepare.outputs.tag }}"
            echo "--- 降级：通过 GitHub API 获取上一个 Release tag ---"
            PREV_TAG=""

              if [ "$BRANCH_NAME" = "beta" ]; then
                echo "按 beta 预发布记录查找上一个 Release tag..."
                PREV_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                  --jq '.[] | select(.prerelease == true) | .tag_name' 2>/dev/null \
                  | grep -v "^${CURRENT_TAG}$" | head -n 1 || echo "")
                [ -n "$PREV_TAG" ] && echo "✓ 找到上一个 beta Release tag: $PREV_TAG"
              else
                LATEST_RELEASE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")

                if [ -n "$LATEST_RELEASE_TAG" ] && [ "$LATEST_RELEASE_TAG" != "$CURRENT_TAG" ]; then
                  echo "✓ GitHub API 返回上一个正式 Release tag: $LATEST_RELEASE_TAG"
                  PREV_TAG="$LATEST_RELEASE_TAG"
                elif [ "$LATEST_RELEASE_TAG" = "$CURRENT_TAG" ]; then
                  echo "⚠️ 最新正式 Release 就是当前版本，尝试获取上一个..."
                  PREV_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
                    --jq '.[] | select(.prerelease == false) | .tag_name' 2>/dev/null \
                    | grep -v "^${CURRENT_TAG}$" | head -n 1 || echo "")
                  [ -n "$PREV_TAG" ] && echo "✓ 找到上一个正式 Release tag: $PREV_TAG"
                else
                  echo "⚠️ GitHub API 未返回有效正式 Release"
                fi
            fi

            # 策略3（再降级）：git tag
            if [ -z "$PREV_TAG" ]; then
              echo "--- 再降级：git tag 查找 ---"
              PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || echo "")
              [ -n "$PREV_TAG" ] && echo "✓ Git tag 找到: $PREV_TAG"
            fi

            if [ -n "$PREV_TAG" ]; then
              if git merge-base --is-ancestor "$PREV_TAG" HEAD 2>/dev/null; then
                echo "✓ $PREV_TAG 是 HEAD 的祖先，使用 tag 范围"
                BASE_SHA="$PREV_TAG"
              else
                echo "⚠️ $PREV_TAG 不是 HEAD 的祖先（force-push/rebase），放弃"
              fi
            fi
          fi

          # 收集提交
          if [ -n "$BASE_SHA" ]; then
            echo "✓ git log ${BASE_SHA}..HEAD"
            git log "${BASE_SHA}..HEAD" --pretty=format:"- %s" --no-merges | head -100 > /tmp/commits.txt
          else
            echo "⚠️ 无可用基准，使用最近 30 天的提交"
            git log --since="30 days ago" --pretty=format:"- %s" --no-merges | head -100 > /tmp/commits.txt
          fi

          COMMIT_COUNT=$(wc -l < /tmp/commits.txt | tr -d ' ')
          echo "✓ Found ${COMMIT_COUNT} commits"
          cat /tmp/commits.txt

      - name: Set up Node.js for changelog generation
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install changelog generator dependencies
        continue-on-error: true
        run: npm install --no-save --no-package-lock openai@6.45.0

      - name: Generate Changelog with AI
        id: changelog
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_COMPLETIONS_PATH: ${{ secrets.AI_COMPLETIONS_PATH }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_KEY2: ${{ secrets.AI_API_KEY2 }}
          AI_BASE_URL2: ${{ secrets.AI_BASE_URL2 }}
          AI_COMPLETIONS_PATH2: ${{ secrets.AI_COMPLETIONS_PATH2 }}
          AI_MODEL2: ${{ secrets.AI_MODEL2 }}
          AI_API_KEY3: ${{ secrets.AI_API_KEY3 }}
          AI_BASE_URL3: ${{ secrets.AI_BASE_URL3 }}
          AI_COMPLETIONS_PATH3: ${{ secrets.AI_COMPLETIONS_PATH3 }}
          AI_MODEL3: ${{ secrets.AI_MODEL3 }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
        run: node scripts/generate-changelog.js

      - name: Prepare Changelog Files
        run: |
          # 若英文 changelog 文件不存在（上一步失败），生成兜底内容
          if [ ! -f /tmp/changelog_en.md ]; then
            echo "⚠️ changelog_en.md not found, using fallback"
            echo "## ${{ needs.prepare.outputs.tag }}" > /tmp/changelog_en.md
            echo "" >> /tmp/changelog_en.md
            echo "### Changes" >> /tmp/changelog_en.md
            echo "" >> /tmp/changelog_en.md
            echo "(Changelog generation failed, please check git log)" >> /tmp/changelog_en.md
          fi

          # 若中文 changelog 文件不存在，生成兜底内容
          if [ ! -f /tmp/changelog_zh.md ]; then
            echo "⚠️ changelog_zh.md not found, using fallback"
            echo "## ${{ needs.prepare.outputs.tag }}" > /tmp/changelog_zh.md
            echo "" >> /tmp/changelog_zh.md
            echo "### 更新内容" >> /tmp/changelog_zh.md
            echo "" >> /tmp/changelog_zh.md
            echo "（Changelog 生成失败，请查阅 git log）" >> /tmp/changelog_zh.md
          fi

          # 复制 changelog 到 release 目录，作为附件
          mkdir -p ./release
          cp /tmp/changelog_en.md ./release/CHANGELOG.md
          cp /tmp/changelog_zh.md ./release/CHANGELOG_ZH.md
          test -s ./release/CHANGELOG.md && test -s ./release/CHANGELOG_ZH.md
          echo "✓ CHANGELOG.md and CHANGELOG_ZH.md saved to release directory"

      - name: Archive CHANGELOG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AilyBlockly-Changelog
          overwrite: true
          if-no-files-found: error
          path: |
            ./release/CHANGELOG.md
            ./release/CHANGELOG_ZH.md

  # 任务 3：发布到 GitHub Release
  release:
    needs: [prepare, prepare-release, build-windows, build-windows-cn, build-macos, build-macos-cn]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Windows-Package
          path: ./release
      - name: Download Windows CN Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Windows-Package-cn
          path: ./release-cn
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-macOS-Package
          path: ./release
      - name: Download macOS CN Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-macOS-Package-cn
          path: ./release-mac-cn
      - name: Download fixed changelog
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Changelog
          path: ./release
      - name: Collect stable update manifests
        if: github.ref_name == 'deploy'
        run: |
          mkdir -p feed
          cp release/latest.yml release/latest-mac.yml release-cn/latest-cn.yml release-mac-cn/latest-mac-cn.yml feed/
          for file in feed/*.yml; do test -s "$file"; done
      - name: Archive stable update manifests
        if: github.ref_name == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: AilyBlockly-Manifests
          path: feed/*.yml
          overwrite: true
          if-no-files-found: error
      - name: Reject reused tags or older channel versions
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > tags.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          node <<'NODE'
          const fs = require('node:fs');
          const semver = require('semver');
          const marker = `<!-- blockly-run:${process.env.GITHUB_REPOSITORY}:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_SHA} -->`;
          const releases = require('./releases.json').flat();
          const existing = releases.find(release => release.tag_name === process.env.RELEASE_TAG);
          const tagExists = require('./tags.json').some(ref => ref.ref === `refs/tags/${process.env.RELEASE_TAG}`);
          if ((existing && !existing.body?.includes(marker)) || (tagExists && !existing)) {
            throw new Error('Release tag belongs to another run; select a new version');
          }
          for (const release of releases) {
            const previous = semver.valid(release.tag_name);
            if (release !== existing && !release.draft && release.prerelease === (process.env.RELEASE_BRANCH === 'beta') && previous &&
                !semver.gt(process.env.RELEASE_VERSION, previous)) {
              throw new Error(`Release must be newer than published ${release.tag_name}`);
            }
          }
          fs.writeFileSync('release-body.md', `${fs.readFileSync('release/CHANGELOG.md', 'utf8')}\n\n${marker}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${Boolean(existing && !existing.draft)}\nrelease_id=${existing?.id || ''}\n`);
          NODE
      - name: Upload packages and changelogs to a draft
        id: draft
        if: steps.release.outputs.published != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          files: |
            ./release/*.exe
            ./release-cn/*.exe
            ./release/*.dmg
            ./release-mac-cn/*.dmg
            ./release/CHANGELOG.md
            ./release/CHANGELOG_ZH.md
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ github.ref_name == 'beta' }}
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify complete Release assets before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id || steps.release.outputs.release_id }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          (async () => {
            const files = ['release/CHANGELOG.md', 'release/CHANGELOG_ZH.md'];
            for (const [directory, extension] of [['release', '.exe'], ['release-cn', '.exe'], ['release', '.dmg'], ['release-mac-cn', '.dmg']]) {
              const names = fs.readdirSync(directory).filter(name => name.endsWith(extension));
              if (names.length !== 1) throw new Error(`Expected exactly one ${extension} in ${directory}`);
              files.push(`${directory}/${names[0]}`);
            }
            const url = `repos/${process.env.GITHUB_REPOSITORY}/releases/${process.env.RELEASE_ID}`;
            const assets = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', `${url}/assets?per_page=100`], { encoding: 'utf8' })).flat();
            if (assets.length !== files.length) throw new Error('Release asset set is incomplete or unexpected');
            for (const file of files) {
              const hash = crypto.createHash('sha256');
              for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
              const asset = assets.find(asset => asset.name === path.basename(file));
              const size = fs.statSync(file).size;
              if (!asset || asset.state !== 'uploaded' || !size || asset.size !== size || asset.digest !== `sha256:${hash.digest('hex')}`) {
                throw new Error(`Release asset verification failed: ${file}`);
              }
            }
            if (process.env.ALREADY_PUBLISHED !== 'true') {
              execFileSync('gh', ['api', url, '--method', 'PATCH', '--input', '-'], {
                input: JSON.stringify({ draft: false, prerelease: process.env.RELEASE_BRANCH === 'beta',
                  make_latest: process.env.RELEASE_BRANCH === 'deploy' ? 'true' : 'false' }), stdio: ['pipe', 'ignore', 'inherit'],
              });
            }
          })();
          NODE

  save-source-baseline:
    needs: [prepare, release, trigger-server-script]
    if: >-
      always() && needs.release.result == 'success' &&
      (github.ref_name == 'beta' || (github.ref_name == 'deploy' && needs.trigger-server-script.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: blockly-release-meta
      cancel-in-progress: false
    steps:
      - name: Save only this Blockly branch's source SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { execFileSync, spawnSync } = require('node:child_process');
          const repository = process.env.GITHUB_REPOSITORY;
          const file = `last-sha-${process.env.RELEASE_BRANCH}`;
          const api = (url, body) => JSON.parse(execFileSync('gh', ['api', url, ...(body ? ['--method', 'PUT', '--input', '-'] : [])], {
            input: body ? JSON.stringify(body) : undefined, encoding: 'utf8',
          }));
          const branch = spawnSync('gh', ['api', `repos/${repository}/git/ref/heads/release-meta`], { encoding: 'utf8' });
          if (branch.status !== 0) {
            if (!branch.stderr.includes('HTTP 404')) throw new Error(branch.stderr);
            const created = spawnSync('gh', ['api', `repos/${repository}/git/refs`, '--method', 'POST', '--input', '-'], {
              input: JSON.stringify({ ref: 'refs/heads/release-meta', sha: process.env.GITHUB_SHA }), encoding: 'utf8',
            });
            if (created.status !== 0) api(`repos/${repository}/git/ref/heads/release-meta`);
          }
          for (let attempt = 0; attempt < 3; attempt++) {
            const current = spawnSync('gh', ['api', `repos/${repository}/contents/${file}?ref=release-meta`], { encoding: 'utf8' });
            if (current.status !== 0 && !current.stderr.includes('HTTP 404')) throw new Error(current.stderr);
            const metadata = current.status === 0 ? JSON.parse(current.stdout) : undefined;
            const sha = metadata?.sha;
            if (metadata) {
              const previous = Buffer.from(metadata.content, 'base64').toString('utf8').trim();
              if (!/^[a-f0-9]{40}$/.test(previous)) throw new Error('Invalid Blockly source baseline');
              if (previous === process.env.GITHUB_SHA) break;
              const relation = execFileSync('gh', ['api', `repos/${repository}/compare/${previous}...${process.env.GITHUB_SHA}`, '--jq', '.status'], { encoding: 'utf8' }).trim();
              if (relation !== 'ahead') throw new Error('Refusing to rewind or diverge the Blockly source baseline');
            }
            try {
              api(`repos/${repository}/contents/${file}`, {
                message: `chore: record Blockly ${process.env.RELEASE_BRANCH} source SHA`,
                content: Buffer.from(`${process.env.GITHUB_SHA}\n`).toString('base64'), branch: 'release-meta', ...(sha ? { sha } : {}),
              });
              break;
            } catch (error) {
              if (attempt === 2 || !/HTTP (409|422)/.test(error.stderr?.toString() || '')) throw error;
            }
          }
          NODE

  # 任务 4a：Release 成功后上传 Windows 软件包，清单在全部包和日志成功后统一发布。
  upload-windows-to-r2:
    needs: [release]
    if: github.ref_name == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Global Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Windows-Package
          path: ./artifacts/windows/global

      - name: Download Windows CN Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Windows-Package-cn
          path: ./artifacts/windows/cn

      - name: Ensure AWS CLI is available
        run: |
          if ! command -v aws &> /dev/null; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Upload Windows files to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_UPLOAD_PATH: ${{ secrets.R2_UPLOAD_PATH }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          shopt -s failglob
          # Cloudflare R2 endpoint
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          
          echo "准备上传 Windows 文件到 Cloudflare R2..."

          upload_windows_dir() {
            local artifact_dir="$1"
          
            echo "上传 ${artifact_dir} 下的 Windows exe 文件..."
            for file in "$artifact_dir"/*.exe; do
              test -s "$file"
              filename=$(basename "$file")
              echo "  上传: $filename"
              aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/${R2_UPLOAD_PATH}/${filename}" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type "application/x-msdownload"
            done
          }

          upload_windows_dir "./artifacts/windows/global"
          upload_windows_dir "./artifacts/windows/cn"
          
          echo "✓ Windows 文件上传到 Cloudflare R2 完成"
          echo "公开访问地址: ${R2_PUBLIC_URL}"

  # 任务 4c：全部软件包成功后，先上传日志，再发布更新清单；重试时一起恢复。
  publish-update-metadata:
    needs: [prepare, upload-windows-to-r2, upload-macos-to-r2]
    if: github.ref_name == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download final manifests for rollback protection
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Manifests
          path: ./manifests
      - name: Download CHANGELOG Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-Changelog
          path: ./artifacts

      - name: Ensure AWS CLI is available
        run: |
          if ! command -v aws &> /dev/null; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Check current versions and publish logs then manifests
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_UPLOAD_PATH: ${{ secrets.R2_UPLOAD_PATH }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          node scripts/blockly-feed-guard.cjs ./manifests "$RELEASE_VERSION"
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          
          echo "上传 CHANGELOG 文件到 Cloudflare R2..."
          
          # upload-artifact@v4 uses least-common-ancestor stripping: both files are under
          # ./release/ so that prefix is stripped; files land directly under ./artifacts/
          for file in CHANGELOG.md CHANGELOG_ZH.md; do
            test -s "./artifacts/${file}"
          done
          for file in CHANGELOG.md CHANGELOG_ZH.md; do
            filepath="./artifacts/${file}"
            echo "  上传: ${file}"
            aws s3 cp "${filepath}" "s3://${R2_BUCKET_NAME}/${R2_UPLOAD_PATH}/${file}" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "text/markdown; charset=utf-8" \
              --cache-control "no-cache, no-store, must-revalidate"
          done

          for name in latest.yml latest-cn.yml latest-mac.yml latest-mac-cn.yml; do
            aws s3 cp "./manifests/$name" "s3://${R2_BUCKET_NAME}/${R2_UPLOAD_PATH}/${name}" \
              --endpoint-url "$R2_ENDPOINT" --content-type 'text/yaml' \
              --cache-control 'no-cache, no-store, must-revalidate'
          done

          echo "✓ 日志和更新清单上传到 Cloudflare R2 完成"

  # 任务 4b：Release 成功后上传 macOS 软件包。
  upload-macos-to-r2:
    needs: [release]
    if: github.ref_name == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Global Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-macOS-Package
          path: ./artifacts/macos/global

      - name: Download macOS CN Artifact
        uses: actions/download-artifact@v4
        with:
          name: AilyBlockly-macOS-Package-cn
          path: ./artifacts/macos/cn

      - name: Ensure AWS CLI is available
        run: |
          if ! command -v aws &> /dev/null; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Upload macOS files to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_UPLOAD_PATH: ${{ secrets.R2_UPLOAD_PATH }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          shopt -s failglob
          # Cloudflare R2 endpoint
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          
          echo "准备上传 macOS 文件到 Cloudflare R2..."

          upload_macos_dir() {
            local artifact_dir="$1"

            echo "上传 ${artifact_dir} 下的 macOS 文件..."
            for file in "$artifact_dir"/*.dmg "$artifact_dir"/*.zip; do
              test -s "$file"
              filename=$(basename "$file")
              echo "  上传: $filename"

              if [[ "$filename" == *.dmg ]]; then
                content_type="application/x-apple-diskimage"
              else
                content_type="application/zip"
              fi

              aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/${R2_UPLOAD_PATH}/${filename}" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type "$content_type"
            done
          }

          upload_macos_dir "./artifacts/macos/global"
          upload_macos_dir "./artifacts/macos/cn"
          
          echo "✓ macOS 文件上传到 Cloudflare R2 完成"
          echo "公开访问地址: ${R2_PUBLIC_URL}"

  # 原有的 SSH 上传方式已注释（备用）
