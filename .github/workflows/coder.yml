name: Aily Coder Package

on:
  push:
    branches:
      - deploy-coder
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aily-coder-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CODER_RELEASE_REPOSITORY: ailyProject/aily-coder

jobs:
  build-and-sign-windows:
    name: Build and test-sign Windows CN package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Read Coder version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./build/products/coder.json').version"
          if (-not $version) {
            throw 'Unable to read Coder version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Coder version: $version"

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install -g @angular/cli
          npm ci --include=dev
          Push-Location electron
          npm ci --include=dev --force
          Pop-Location

      - name: Build aily coder Windows package
        run: npm run build:coder
        env:
          NODE_ENV: production

      - name: Add beta marker to test installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $outputDirectory = Join-Path $PWD 'dist/aily-coder'
          $sourcePath = Join-Path $outputDirectory "aily-coder-CN-Setup-$version.exe"
          $betaPath = Join-Path $outputDirectory "aily-coder-CN-Setup-beta-$version.exe"

          if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
            throw "Unsigned installer not found: $sourcePath"
          }

          Move-Item -LiteralPath $sourcePath -Destination $betaPath
          Write-Host "Test installer: $(Split-Path -Leaf $betaPath)"

      - name: Upload unsigned installer for SignPath
        id: upload_unsigned_coder
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-aily-coder-windows-cn
          path: dist/aily-coder/aily-coder-CN-Setup-beta-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Sign installer with SignPath test certificate
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'bd01a768-a9e3-4a62-945d-fcfdc37a299e'
          project-slug: 'aily-blockly'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'aily-coder'
          github-artifact-id: '${{ steps.upload_unsigned_coder.outputs.artifact-id }}'
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          output-artifact-directory: dist/aily-coder

      - name: Rebuild latest.yml from signed installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $outputDirectory = Join-Path $PWD 'dist/aily-coder'
          $installerName = "aily-coder-CN-Setup-beta-$version.exe"
          $installerPath = Join-Path $outputDirectory $installerName

          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Signed installer not found: $installerPath"
          }

          Get-ChildItem -LiteralPath $outputDirectory -Filter '*.blockmap' -File |
            Remove-Item -Force

          $installer = Get-Item -LiteralPath $installerPath
          $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA512
          $hashBytes = [System.Convert]::FromHexString($hash.Hash)
          $sha512 = [System.Convert]::ToBase64String($hashBytes)
          $releaseDate = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $content = @(
            "version: $version"
            'files:'
            "  - url: $installerName"
            "    sha512: $sha512"
            "    size: $($installer.Length)"
            "path: $installerName"
            "sha512: $sha512"
            "releaseDate: '$releaseDate'"
          ) -join "`n"

          $manifestPath = Join-Path $outputDirectory 'latest.yml'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($manifestPath, "$content`n", $utf8NoBom)
          Write-Host "Rebuilt latest.yml for signed installer: $installerName"

      - name: Archive signed Coder package
        uses: actions/upload-artifact@v4
        with:
          name: AilyCoder-Windows-Package-cn
          path: |
            dist/aily-coder/aily-coder-CN-Setup-beta-${{ steps.version.outputs.version }}.exe
            dist/aily-coder/latest.yml
          if-no-files-found: error

  build-and-sign-macos:
    name: Build, sign and notarize macOS CN package
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Read Coder version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./build/products/coder.json').version")
          if [ -z "$version" ]; then
            echo "Unable to read Coder version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Coder version: $version"

      - name: Install dependencies
        run: |
          npm install -g @angular/cli
          npm ci --include=dev
          cd electron
          npm ci --include=dev --force

      - name: Import codesign certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_SIGNING_PASSWORD }}

      - name: Verify codesign certificate
        shell: bash
        run: |
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "No Developer ID Application certificate found" >&2
            exit 1
          fi

      - name: Build, sign and notarize aily coder macOS package
        run: npm run build:coder
        env:
          NODE_ENV: production
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize, staple and mark macOS test package
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          version='${{ steps.version.outputs.version }}'
          output_directory='dist/aily-coder'
          dmg_count=0

          while IFS= read -r -d '' dmg_path; do
            xcrun notarytool submit "$dmg_path" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 30m

            xcrun stapler staple "$dmg_path"

            original_name=$(basename "$dmg_path")
            beta_name=${original_name/aily-coder-CN-macos-/aily-coder-CN-macos-beta-}
            beta_path="$(dirname "$dmg_path")/$beta_name"
            mv "$dmg_path" "$beta_path"

            xcrun stapler validate "$beta_path"
            echo "Test package: $beta_name"
            dmg_count=$((dmg_count + 1))
          done < <(
            find "$output_directory" -maxdepth 1 -type f \
              -name "aily-coder-CN-macos-${version}-*.dmg" -print0
          )

          if [ "$dmg_count" -eq 0 ]; then
            echo "macOS DMG not found in $output_directory" >&2
            exit 1
          fi

      - name: Archive signed Coder macOS package
        uses: actions/upload-artifact@v4
        with:
          name: AilyCoder-macOS-Package-cn
          path: dist/aily-coder/aily-coder-CN-macos-beta-${{ steps.version.outputs.version }}-*.dmg
          if-no-files-found: error

  publish-test-release:
    name: Publish test release to ailyProject/aily-coder
    needs: [build-and-sign-windows, build-and-sign-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download signed Coder package
        uses: actions/download-artifact@v4
        with:
          name: AilyCoder-Windows-Package-cn
          path: release

      - name: Download signed Coder macOS package
        uses: actions/download-artifact@v4
        with:
          name: AilyCoder-macOS-Package-cn
          path: release-macos

      - name: Require target repository token
        env:
          TARGET_REPOSITORY_TOKEN: ${{ secrets.AILY_CODER_RELEASE_TOKEN }}
        run: |
          if [ -z "$TARGET_REPOSITORY_TOKEN" ]; then
            echo "Missing repository secret: AILY_CODER_RELEASE_TOKEN" >&2
            exit 1
          fi

      - name: Verify target repository is initialized
        id: target_repository
        env:
          GH_TOKEN: ${{ secrets.AILY_CODER_RELEASE_TOKEN }}
          TARGET_REPOSITORY: ${{ env.CODER_RELEASE_REPOSITORY }}
        run: |
          default_branch=$(gh api "repos/${TARGET_REPOSITORY}" --jq '.default_branch')
          if ! gh api "repos/${TARGET_REPOSITORY}/commits/${default_branch}" --silent >/dev/null 2>&1; then
            echo "::error::${TARGET_REPOSITORY} has no commits. Initialize it with a README before publishing a release."
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

      - name: Create aily coder test release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.CODER_RELEASE_REPOSITORY }}
          token: ${{ secrets.AILY_CODER_RELEASE_TOKEN }}
          tag_name: v${{ needs.build-and-sign-windows.outputs.version }}
          target_commitish: ${{ steps.target_repository.outputs.default_branch }}
          name: aily coder v${{ needs.build-and-sign-windows.outputs.version }} (beta)
          body: |
            Beta Windows and macOS packages built from
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            Windows uses SignPath test signing. macOS uses Apple Developer ID signing and notarization.
          files: |
            release/aily-coder-CN-Setup-beta-${{ needs.build-and-sign-windows.outputs.version }}.exe
            release/latest.yml
            release-macos/aily-coder-CN-macos-beta-${{ needs.build-and-sign-windows.outputs.version }}-*.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false
