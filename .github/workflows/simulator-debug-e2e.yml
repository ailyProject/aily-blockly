name: ESP32-S3 Simulator Generic Host E2E

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: aily-builder branch, tag, or commit
        required: true
        default: i3w
        type: string
      simulator_ref:
        description: aily-simulator branch, tag, or commit
        required: true
        default: i3w
        type: string
  pull_request:
    paths:
      - ".github/workflows/simulator-debug-e2e.yml"
      - "child/scripts/compile.js"
      - "e2e/tests/simulator-generic-host-route.spec.ts"
      - "electron/child-tool-**"
      - "electron/subapp-**"
      - "scripts/e2e-local-simulator-generic-child-tool-host.mjs"
      - "scripts/run-simulator-generic-host-route-e2e.mjs"
      - "scripts/stage-local-simulator-host-sdk.mjs"
      - "src/app/integrations/simulator/**"
      - "src/app/services/subapp-host-provider-**"
      - "src/app/tools/child-tool-host/**"
  push:
    branches:
      - i3w-new-checkpoint
    paths:
      - ".github/workflows/simulator-debug-e2e.yml"
      - "child/scripts/compile.js"
      - "e2e/tests/simulator-generic-host-route.spec.ts"
      - "electron/child-tool-**"
      - "electron/subapp-**"
      - "scripts/e2e-local-simulator-generic-child-tool-host.mjs"
      - "scripts/run-simulator-generic-host-route-e2e.mjs"
      - "scripts/stage-local-simulator-host-sdk.mjs"
      - "src/app/integrations/simulator/**"
      - "src/app/services/subapp-host-provider-**"
      - "src/app/tools/child-tool-host/**"

permissions:
  contents: read

concurrency:
  group: simulator-generic-host-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patched-qemu:
    name: Build patched QEMU (Windows x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out Simulator
        uses: actions/checkout@v4
        with:
          repository: ailyProject/aily-simulator
          ref: ${{ inputs.simulator_ref || 'i3w' }}
          path: aily-simulator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore patched QEMU build
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: aily-simulator/.runtime/build/aily-qemu/windows-x64
          key: >-
            patched-qemu-win32-x64-${{
              hashFiles(
                'aily-simulator/native/aily-qemu/upstream.json',
                'aily-simulator/native/aily-qemu/patches/*.patch',
                'aily-simulator/native/aily-qemu/docker/**',
                'aily-simulator/native/aily-qemu/runtime/win32-x64.json'
              )
            }}

      - name: Build patched QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        working-directory: aily-simulator
        run: node native/aily-qemu/scripts/build-windows.mjs

      - name: Verify patched QEMU hash
        working-directory: aily-simulator
        run: |
          node --input-type=module -e "
            import { createHash } from 'node:crypto';
            import { readFile } from 'node:fs/promises';
            const descriptor = JSON.parse(await readFile(
              'native/aily-qemu/runtime/win32-x64.json',
              'utf8',
            ));
            const executable = await readFile(
              '.runtime/build/aily-qemu/windows-x64/install/qemu/bin/qemu-system-xtensa.exe',
            );
            const actual = createHash('sha256').update(executable).digest('hex');
            if (actual !== descriptor.expectedExecutableSha256) {
              throw new Error(
                'Patched QEMU SHA-256 mismatch: ' + actual
                + ' != ' + descriptor.expectedExecutableSha256,
              );
            }
            console.log(actual);
          "

      - name: Upload patched QEMU
        uses: actions/upload-artifact@v4
        with:
          name: patched-qemu-win32-x64
          path: aily-simulator/.runtime/build/aily-qemu/windows-x64
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  desktop-e2e:
    name: Blockly -> Generic Host -> QEMU/GDB
    needs: patched-qemu
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out Blockly
        uses: actions/checkout@v4
        with:
          path: aily-blockly
          persist-credentials: false

      - name: Check out Builder
        uses: actions/checkout@v4
        with:
          repository: ailyProject/aily-builder
          ref: ${{ inputs.builder_ref || 'i3w' }}
          path: aily-builder
          persist-credentials: false

      - name: Check out Simulator
        uses: actions/checkout@v4
        with:
          repository: ailyProject/aily-simulator
          ref: ${{ inputs.simulator_ref || 'i3w' }}
          path: aily-simulator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            aily-blockly/package-lock.json
            aily-builder/package-lock.json
            aily-simulator/package-lock.json

      - name: Download patched QEMU
        uses: actions/download-artifact@v4
        with:
          name: patched-qemu-win32-x64
          path: aily-simulator/.runtime/build/aily-qemu/windows-x64

      - name: Install repository dependencies
        shell: pwsh
        run: |
          npm ci --prefix aily-builder
          npm ci --prefix aily-simulator
          npm ci --prefix aily-blockly

      - name: Test Simulator debugger panel
        working-directory: aily-simulator
        shell: pwsh
        run: npm run test:debug-panel

      - name: Test Simulator host
        working-directory: aily-simulator
        shell: pwsh
        run: npm run host:test

      - name: Test installed package through the generic Host
        working-directory: aily-blockly
        shell: pwsh
        run: npm run test:e2e:local-simulator-generic-host
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run real Blockly/QEMU/GDB route closure
        working-directory: aily-blockly
        shell: pwsh
        run: npm run test:e2e:local-simulator-route -- --fast
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-simulator-generic-host-e2e
          path: |
            aily-blockly/test-results/**
            aily-blockly/playwright-report/**
            aily-simulator/.runtime/distribution/aily-simulator-runtime-win32-x64/aily-simulator-runtime.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
