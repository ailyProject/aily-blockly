<div class="lib-manager-box">
    <div class="header">
        <button type="button" class="btn header-nav-button home-button ccenter" (click)="home()" nz-tooltip
            nzTooltipPlacement="bottom" [nzTooltipTitle]="'PLAYGROUND.HOME' | translate"
            [attr.aria-label]="'PLAYGROUND.HOME' | translate">
            <i class="fa-regular fa-house"></i>
        </button>
        <button type="button" class="btn header-nav-button ccenter" (click)="back()" [disabled]="!canGoBack"
            nz-tooltip nzTooltipPlacement="bottom" [nzTooltipTitle]="'LIB_MANAGER.BACK' | translate"
            [attr.aria-label]="'LIB_MANAGER.BACK' | translate">
            <i class="fa-regular fa-chevron-left"></i>
        </button>
        <nz-input-group [nzSuffix]="suffixIconSearch" [nzSize]="'small'">
            <input type="text" nz-input [placeholder]="'搜索示例' | translate" [(ngModel)]="keyword"
                (ngModelChange)="search()" />
        </nz-input-group>
        <ng-template #suffixIconSearch>
            @if(keyword.length > 0){
            <i class="fa-light fa-xmark" (click)="search('')"></i>
            } @else {
            <i class="fa-light fa-search"></i>
            }
        </ng-template>
        <div class="tag-list">
            @for (tag of tagList; track tag) {
            <nz-tag (click)="search(tag.text)" [nzColor]="tag.color">{{ tag.text }}</nz-tag>
            }
        </div>
    </div>
    <router-outlet></router-outlet>
</div>
