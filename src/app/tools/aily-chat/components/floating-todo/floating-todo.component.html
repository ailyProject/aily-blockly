<div class="chat-todo-list-widget has-todos" *ngIf="todoList && todoList.length > 0">
  <div class="todo-list-expand">
    <button
      type="button"
      class="todo-list-toggle"
      (click)="toggleCollapse()"
      [attr.aria-expanded]="!isCollapsed"
      [attr.aria-label]="getToggleAriaLabel()"
      [attr.aria-controls]="getTodoListContainerId()">
      <span class="todo-list-title-section">
        <i class="fas fa-chevron-right expand-icon" [class.expanded]="!isCollapsed"></i>
        <span class="todo-list-title" [id]="getTodoListTitleId()">
          @if (getHeaderStatus(); as headerStatus) {
            <i class="fas todo-header-status-icon"
               [class.fa-circle]="headerStatus === 'not-started'"
               [class.fa-circle-dot]="headerStatus === 'in-progress'"
               [class.fa-circle-check]="headerStatus === 'completed'"
               [class.status-pending]="headerStatus === 'not-started'"
               [class.status-in-progress]="headerStatus === 'in-progress'"
               [class.status-completed]="headerStatus === 'completed'"></i>
          }
          <span class="todo-list-title-text">{{ getHeaderTitle() }}</span>
        </span>
      </span>
    </button>
    <div class="todo-clear-button-container">
      <button
        type="button"
        class="todo-clear-button"
        (click)="clearAllTodos($event)"
        [disabled]="isClearDisabled()"
        [attr.title]="getClearButtonTitle()"
        [attr.aria-label]="getClearButtonTitle()">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  </div>

  <div
    class="todo-list-container"
    *ngIf="!isCollapsed"
    #todoListContainer
    [id]="getTodoListContainerId()"
    role="list"
    [attr.aria-labelledby]="getTodoListTitleId()">
    <div class="todo-list" role="presentation">
      <button
           type="button"
           class="todo-item"
         #todoItemButton
           *ngFor="let todo of todoList; trackBy: trackByTodoId"
           [class.completed]="todo.status === 'completed'"
           [attr.aria-label]="getTodoAriaLabel(todo)"
           (click)="toggleTodoStatus(todo)">
        <i class="fas todo-status-icon"
           [class.fa-circle]="todo.status === 'not-started'"
           [class.fa-circle-dot]="todo.status === 'in-progress'"
           [class.fa-circle-check]="todo.status === 'completed'"
           [class.status-pending]="todo.status === 'not-started'"
           [class.status-in-progress]="todo.status === 'in-progress'"
           [class.status-completed]="todo.status === 'completed'"></i>

        <div class="todo-content">
          <span class="todo-text" [class.completed-text]="todo.status === 'completed'">
            {{ todo.content }}
          </span>
        </div>
      </button>
    </div>
  </div>
</div>
