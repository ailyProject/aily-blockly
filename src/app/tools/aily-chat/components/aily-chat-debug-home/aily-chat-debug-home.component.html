<div class="chat-debug-home">
  <div class="chat-debug-home-header">
    <div class="chat-debug-home-heading">
      <div class="chat-debug-home-eyebrow">调试面板</div>
      <div class="chat-debug-home-title">导入的调试快照</div>
      <div class="chat-debug-home-subtitle">独立于普通聊天会话的只读 debug resource 列表。</div>
    </div>
    <div class="chat-debug-home-actions">
      <button type="button" class="chat-debug-home-action" (click)="importRequested.emit()">导入快照</button>
      <button type="button" class="chat-debug-home-action secondary" (click)="closeRequested.emit()">返回聊天</button>
    </div>
  </div>

  @if (sessions.length > 0) {
  <div class="chat-debug-home-list" role="list" aria-label="Imported debug snapshots" (keydown)="onListKeydown($event)">
    @for (session of visibleSessions; track session.sessionId) {
    <button
      #sessionButton
      type="button"
      class="chat-debug-home-item"
      role="listitem"
      [class.active]="activeSessionId === session.sessionId"
      [attr.aria-current]="activeSessionId === session.sessionId ? 'true' : null"
      [attr.aria-label]="getSessionAriaLabel(session)"
      (click)="sessionRequested.emit(session.sessionId)">
      <div class="chat-debug-home-item-title">{{ session.displayTitle }}</div>
      <div class="chat-debug-home-item-meta">源会话 {{ session.sourceSessionId }} · {{ session.importedAt | date:'yyyy-MM-dd HH:mm:ss' }}</div>
    </button>
    }
  </div>
  @if (hasMoreSessions) {
  <button type="button" class="chat-debug-home-action secondary chat-debug-home-show-more" (click)="showMore()">
    显示更多 ({{ remainingSessionCount }})
  </button>
  }
  } @else {
  <div class="chat-debug-home-empty">
    <div class="chat-debug-home-empty-title">还没有导入的调试快照</div>
    <div class="chat-debug-home-empty-text">先导入一个 debug export，再从这里进入独立只读 viewer。</div>
    <button type="button" class="chat-debug-home-action" (click)="importRequested.emit()">导入第一个快照</button>
  </div>
  }
</div>
