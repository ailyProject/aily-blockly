<div
  #pickerRoot
  class="session-picker-panel bborder"
  [ngStyle]="{ left: position.x + 'px', top: position.y + 'px', width: width + 'px', 'max-height': maxHeight + 'px' }">
  <div class="session-picker-search-row">
    <i class="fa-light fa-magnifying-glass"></i>
    <input
      #searchInput
      type="text"
      class="session-picker-search-input"
      [(ngModel)]="filterValue"
      (ngModelChange)="handleFilterChanged()"
      placeholder="Search sessions"
      (click)="$event.stopPropagation()" />
  </div>

  <aily-chat-session-entries
    [groups]="filteredGroups"
    [items]="filteredItems"
    [selectedSessionId]="selectedSessionId"
    listAriaLabel="Session picker"
    emptyLabel="No matching sessions"
    currentBadgeLabel="Current"
    variant="picker"
    (selectSession)="selectSession.emit($event)"
    (actionClick)="actionClick.emit($event)"></aily-chat-session-entries>
</div>
