<app-sub-window [title]="windowTitle" [winBtns]="['minimize', 'maximize', 'close']">
  <div class="process-detail-window">
    <app-chat-process-detail-panel
      [title]="command || processId || ('AILY_CHAT.PROCESS_FALLBACK_TERMINAL_COMMAND' | translate)"
      [actionVisible]="!!outputFilePath"
      actionLabel="AILY_CHAT.PROCESS_ACTION_OPEN_OUTPUT"
      actionIconClass="fa-light fa-arrow-up-right-from-square"
      [statusText]="displayStatus"
      [elapsedText]="summary ? formatElapsedMs(summary?.elapsedMs) : '-'"
      [running]="summary?.running === true"
      [startedAt]="summary?.startedAt ?? null"
      [completedAt]="summary?.completedAt ?? null"
      [exitCode]="summary?.exitCode ?? null"
      outputTitle="AILY_CHAT.PROCESS_OUTPUT_TERMINAL"
      [output]="output"
      emptyOutputText="AILY_CHAT.PROCESS_OUTPUT_EMPTY"
      (actionClick)="openOutputFile()"
    />
  </div>
</app-sub-window>
