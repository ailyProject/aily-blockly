<div class="settings">
    <div class="line">
        <div class="item">
            <div class="title">{{ 'SERIAL.DATA_BITS' | translate }}</div>
            <div class="item-inner ccenter" [ngClass]="{'selected':menuList == dataBitsList}"
                (click)="openMenu($event, dataBitsList)">
                <div class="value">{{selectedDataBits.name}}</div>
                <div class="arrow-box">
                    <i class="fa-light fa-angle-right arrow"></i>
                </div>
            </div>
        </div>
        <div class="item">
            <div class="title">{{ 'SERIAL.STOP_BITS' | translate }}</div>
            <div class="item-inner ccenter" [ngClass]="{'selected':menuList == stopBitsList}"
                (click)="openMenu($event, stopBitsList)">
                <div class="value">{{selectedStopBits.name}}</div>
                <div class="arrow-box">
                    <i class="fa-light fa-angle-right arrow"></i>
                </div>
            </div>
        </div>
        <div class="item">
            <div class="title">{{ 'SERIAL.PARITY' | translate }}</div>
            <div class="item-inner ccenter" [ngClass]="{'selected':menuList == parityList}"
                (click)="openMenu($event, parityList)">
                <div class="value">{{selectedParity.name | translate}}</div>
                <div class="arrow-box">
                    <i class="fa-light fa-angle-right arrow"></i>
                </div>
            </div>
        </div>
        <div class="item">
            <div class="title">{{ 'SERIAL.FLOW_CONTROL' | translate }}</div>
            <div class="item-inner ccenter" style="width: 100px;" [ngClass]="{'selected':menuList == flowControlList}"
                (click)="openMenu($event, flowControlList)">
                <div class="value">{{selectedFlowControl.name | translate}}</div>
                <div class="arrow-box">
                    <i class="fa-light fa-angle-right arrow"></i>
                </div>
            </div>
        </div>
    </div>
</div>

@if (showMenu) {
<app-menu [position]="position" [width]="90" [menuList]="menuList" (closeEvent)="closeMenu()"
    (itemClickEvent)="select($event)"></app-menu>
}
