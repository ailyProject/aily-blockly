<div class="footer-box">
  <!-- 打开的窗口就显示图标在这里 -->
  @for(item of FOOTER_BTNS; track item.name) {
  <div class="btn ccenter" 
       [class.active]="isButtonActive(item)" 
       [nzTooltipTitle]="item.text | translate"
       nz-tooltip 
       (click)="process(item)">
    <i class="{{item.icon}}"></i>
  </div>
  }
  <div class="footer-status-area">
    <!-- 这里显示状态，如保存中，项目加载中，正在安装xxx等 -->
    @if(actionData){
    <div class="state ccenter">
      @switch(actionData.state){
      @case('doing'){
      <div class="icon lloading ccenter">
        <i class="fa-duotone fa-solid fa-loader"></i>
      </div>
      }
      @case('error'){
      <div class="icon ccenter">
        <i class="fa-light fa-circle-xmark"></i>
      </div>
      }
      @case('warn'){
      <div class="icon ccenter">
        <i class="fa-light fa-triangle-exclamation"></i>
      </div>
      }
      @case('done'){
      <div class="icon ccenter">
        <i class="fa-light fa-circle-check"></i>
      </div>
      }
      }
      {{ actionData.text }}
    </div>
    }

    @if(showUpdateIndicator){
    <button
      type="button"
      class="update-indicator"
      [class.downloading]="updateStatus === 'downloading'"
      [class.ready]="updateStatus === 'downloaded'"
      [class.error]="updateStatus === 'error'"
      [attr.aria-label]="updateIndicatorTooltip"
      [nzTooltipTitle]="updateIndicatorTooltip"
      nz-tooltip
      nzTooltipPlacement="topRight"
      (click)="openUpdateDialog($event)">
      <span class="update-icon" aria-hidden="true">
        @if(updateStatus === 'downloading'){
        <svg class="update-progress-ring" viewBox="0 0 24 24">
          <circle class="update-progress-track" cx="12" cy="12" r="10.5"></circle>
          <circle
            class="update-progress-value"
            cx="12"
            cy="12"
            r="10.5"
            [attr.stroke-dashoffset]="updateProgressOffset"></circle>
        </svg>
        }
        <i class="fa-light fa-cloud-arrow-down"></i>
        @if(updateStatus === 'downloaded'){
        <span class="update-ready-dot"></span>
        }
      </span>
    </button>
    }
  </div>
</div>
