<div class="footer-box">
  <!-- 打开的窗口就显示图标在这里 -->
  @for(item of FOOTER_BTNS; track item.name) {
  <div class="btn ccenter" 
       [class.active]="isButtonActive(item)" 
       [nzTooltipTitle]="item.text | translate"
       nz-tooltip 
       (click)="process(item)">
    <i class="{{item.icon}}"></i>
  </div>
  }
  <!-- 这里显示状态，如保存中，项目加载中，正在安装xxx等 -->
  @if(actionData){
  <div class="state ccenter">
    <!-- spinner 容器按 state 切换 class，避免仅文案更新时销毁旋转节点导致动画重启 -->
    <div class="icon ccenter" [class.lloading]="actionData.state === 'doing'">
      @switch(actionData.state){
      @case('doing'){
      <i class="fa-duotone fa-solid fa-loader"></i>
      }
      @case('error'){
      <i class="fa-light fa-circle-xmark"></i>
      }
      @case('warn'){
      <i class="fa-light fa-triangle-exclamation"></i>
      }
      @case('done'){
      <i class="fa-light fa-circle-check"></i>
      }
      }
    </div>
    {{ actionData.text }}
  </div>
  }
</div>
