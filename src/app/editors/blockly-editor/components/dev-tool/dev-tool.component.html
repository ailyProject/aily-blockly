<div #devtoolBox class="devtool-box">
    <div #dragHandle class="drag-handle" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.DRAG_TO_MOVE' | translate"
        [nzTooltipVisible]="dragTooltipVisible">
        <i class="fa-solid fa-grip-dots-vertical"></i>
    </div>
    <div class="btn ccenter" [class.disabled]="reloadDisabled" (click)="reload()" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.RELOAD_PROJECT' | translate">
        <i class="fa-light fa-sync" [class.reloading]="reloadDisabled"></i>
    </div>
    <div class="btn ccenter" (click)="clear()" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.CLEAR_CACHE' | translate">
        <i class="fa-light fa-broom-wide"></i>
    </div>
    <div class="line">
    </div>
    <div class="btn ccenter" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.PROJECT_SETTINGS' | translate" (click)="openSettings()">
        <i class="fa-light fa-folder-bookmark"></i>
    </div>
    <div class="btn ccenter" [class.disabled]="isArchitectureGenerating"
        [attr.aria-disabled]="isArchitectureGenerating" nz-tooltip
        [nzTooltipTitle]="'FLOAT_SIDER.ARCH' | translate" (click)="showArch()">
        <i class="fa-light fa-diagram-project"></i>
        @if (isArchitectureGenerating) {
            <i class="ai-generation-loading fa-regular fa-spinner-third fa-spin" aria-hidden="true"></i>
        }
    </div>
    <div class="btn ccenter" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.PINMAP' | translate" (click)="showPinmap()">
        <i class="fa-light fa-microchip"></i>
    </div>
    <div class="btn ccenter" [class.disabled]="isSchematicGenerating"
        [attr.aria-disabled]="isSchematicGenerating" nz-tooltip
        [nzTooltipTitle]="'FLOAT_SIDER.CIRCUIT' | translate" (click)="showCircuit()">
        <i class="fa-light fa-code-branch"></i>
        @if (isSchematicGenerating) {
            <i class="ai-generation-loading fa-regular fa-spinner-third fa-spin" aria-hidden="true"></i>
        }
    </div>
    <div class="btn ccenter" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.DOCUMENTATION' | translate" (click)="openDocUrl()">
        <i class="fa-light fa-book"></i>
    </div>
    <div class="line">
    </div>
    <div class="btn ccenter" nz-tooltip [nzTooltipTitle]="'FLOAT_SIDER.FEEDBACK' | translate" (click)="openFeedback()">
        <i class="fa-light fa-message-pen"></i>
    </div>

        <i class="fa-light fa-xmark"></i>
    </div> -->
</div>
