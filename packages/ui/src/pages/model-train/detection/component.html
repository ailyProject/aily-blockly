<article hlmCard class="panel">
  <span hlmBadge variant="secondary">Detection</span>
  <h3>Object Detection Pipeline</h3>
  <div class="steps">
    @for (item of checklist; track item) {
      <div class="step">{{ item }}</div>
    }
  </div>

  <div class="catalog-grid">
    @for (item of models; track item.id) {
      <div class="catalog-card">
        <strong>{{ item.name }}</strong>
        <span>{{ item.board }}</span>
        <span>{{ item.summary }}</span>
      </div>
    }
  </div>
</article>
