<section class="ffs-page">
  <input #imageInputEl type="file" class="hidden-input" (change)="handleImageFileChange($event)" />
  <input #fileInputEl type="file" class="hidden-input" (change)="handleFileUploadChange($event)" />

  <ffs-manager-summary-panels [state]="state()" />

  <ffs-manager-preview-panel
    [state]="state()"
    [imageName]="imageName()"
    [hasImageBytes]="!!imageBytes()"
    [previewBusy]="previewBusy()"
    [currentPath]="currentPath()"
    [breadcrumbs]="breadcrumbs()"
    [explorerEntries]="explorerEntries()"
    (imageInputClick)="imageInputEl.click()"
    (fileInputClick)="fileInputEl.click()"
    (formatImage)="formatCurrentImage()"
    (createDirectory)="createDirectory()"
    (downloadImage)="downloadImage()"
    (currentPathChange)="currentPath.set($event)"
    (previewEntry)="previewEntry($event)"
    (renameEntry)="renameEntry($event)"
    (deleteEntry)="deleteEntry($event)"
  />

  @if (previewFilePath()) {
    <article hlmCard class="panel">
      <header class="panel-header">
        <div>
          <p class="eyebrow">File Preview</p>
          <h2>{{ previewFilePath() }}</h2>
        </div>
      </header>

      <pre class="text-preview">{{ previewText() }}</pre>
    </article>
  }

  @if (actionMessage()) {
    <article hlmCard class="panel">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Activity</p>
          <h2>Last Action</h2>
        </div>
      </header>

      <strong>{{ actionMessage() }}</strong>
    </article>
  }
</section>
