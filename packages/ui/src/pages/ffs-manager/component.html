<section class="ffs-page">
  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Flash FS</p>
        <h2>Transport Snapshot</h2>
      </div>
    </header>

    @if (state(); as viewState) {
      <div class="metric-grid">
        <div><span>Port</span><strong>{{ viewState.serial.port }}</strong></div>
        <div><span>Baud</span><strong>{{ viewState.serial.baudRate }}</strong></div>
      </div>
    }
  </article>

  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Prepared Connect</p>
        <h2>ESP Session Seed</h2>
      </div>
    </header>

    @if (state(); as viewState) {
      <div class="metric-grid">
        <div><span>Path</span><strong>{{ viewState.connect.path }}</strong></div>
        <div><span>Baud</span><strong>{{ viewState.connect.baudRate }}</strong></div>
      </div>
    }
  </article>
</section>
