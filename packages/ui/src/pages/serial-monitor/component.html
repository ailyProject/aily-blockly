<app-shell>
	<div shell-actions>
		<button hlmBtn variant="outline" size="sm" (click)="refresh()">Refresh</button>
		<button hlmBtn size="sm" [disabled]="loading() || busy()" (click)="toggleConnection()">
			{{ state()?.session?.connected ? 'Disconnect' : 'Connect' }}
		</button>
		<button
			hlmBtn
			variant="outline"
			size="sm"
			[disabled]="loading() || busy() || !state()?.connectOptions?.path"
			(click)="runUpload()"
		>
			Upload
		</button>
	</div>

	<section class="serial-page">
		@if (loading()) {
		<article hlmCard class="serial-card"><strong>Loading serial monitor...</strong></article>
		} @else if (error()) {
		<article hlmCard class="serial-card error">
			<strong>Failed to load serial monitor</strong>
			<p>{{ error() }}</p>
		</article>
		} @else if (state(); as stateValue) {
		<serial-monitor-connection-card
			[state]="stateValue"
			[busy]="busy()"
			(choosePort)="choosePort($event)"
			(chooseBaudRate)="chooseBaudRate($event)"
		/>

		<serial-monitor-quick-send-card
			[quickSendList]="stateValue.quickSendList"
			[connected]="!!stateValue.session?.connected"
			[busy]="busy()"
			(quickSend)="sendQuick($event)"
		/>

		@if (uploadResult(); as uploadValue) {
		<serial-monitor-upload-card
			[uploadResult]="uploadValue"
			[currentPort]="stateValue.connectOptions.path"
			[busy]="busy()"
			(reconnect)="reconnect()"
			(refresh)="refresh()"
			(retryUpload)="runUpload()"
		/>
		}

		<serial-monitor-stream-card
			[state]="stateValue"
			[messages]="messages()"
			[inputValue]="inputValue()"
			[busy]="busy()"
			(inputValueChange)="inputValue.set($event)"
			(onInputKeydown)="onInputKeydown($event)"
			(toggleHexView)="toggleHexView()"
			(toggleTimestamp)="toggleTimestamp()"
			(toggleAutoScroll)="toggleAutoScroll()"
			(clearMessages)="clearMessages()"
			(toggleHexInput)="toggleHexInput()"
			(toggleSendByEnter)="toggleSendByEnter()"
			(toggleEndR)="toggleEndR()"
			(toggleEndN)="toggleEndN()"
			(send)="send()"
		/>
		}
	</section>
</app-shell>
