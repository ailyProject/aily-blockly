<section class="project-new-page">
	@if (loading()) {
	<article hlmCard class="panel">
		<strong>Loading project defaults...</strong>
	</article>
	} @else if (error()) {
	<article hlmCard class="panel error">
		<strong>Failed to load project defaults</strong>
		<p>{{ error() }}</p>
	</article>
	} @else {
	<project-new-setup-panel
		[projectName]="projectName()"
		[nameValidationMessage]="nameValidationMessage()"
		[rootPath]="rootPath()"
		[resolvedProjectPath]="resolvedProjectPath()"
		[pathConflict]="pathConflict()"
		[importBusy]="importBusy()"
		[runtimeAvailable]="!!runtimeInfo()"
		[canCreate]="canCreateBlankProject()"
		(reload)="refresh()"
		(projectNameChange)="updateProjectNameValue($event)"
		(chooseRootFolder)="chooseRootPath()"
		(suggestAvailableName)="suggestAvailableName()"
		(createBlankProject)="createBlankProject()"
	/>

	<project-new-board-panel
		[selectedBoardName]="selectedBoardName()"
		[hasExamples]="hasExamples()"
		[boardOptions]="boardOptions"
		(boardSelect)="chooseBoard($event)"
	/>

	<project-new-recent-panel [recentProjects]="recentProjects()" (projectSelect)="useRecentProject($event)" />

	<project-new-template-panel
		[templateSourceMode]="templateSourceMode()"
		[authToken]="authToken()"
		[templates]="templates()"
		[selectedTemplate]="selectedTemplate()"
		[importBusy]="importBusy()"
		[pathConflict]="pathConflict()"
		[nameValidationMessage]="nameValidationMessage()"
		[importMessage]="importMessage()"
		(templateSourceModeSelect)="selectTemplateSourceMode($event)"
		(authTokenChange)="updateAuthTokenValue($event)"
		(templateSelect)="chooseTemplate($event)"
		(importTemplate)="importSelectedTemplate()"
	/>
	}
</section>
