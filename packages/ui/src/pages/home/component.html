<app-shell>
  <div shell-actions class="actions">
    <button hlmBtn variant="outline" (click)="handleThemeToggle()">
      @if (themeMode() === 'dark') {
        <ng-icon name="lucideSunMedium" class="button-icon"></ng-icon>
      } @else {
        <ng-icon name="lucideMoonStar" class="button-icon"></ng-icon>
      }
      {{ themeActionLabel }}
    </button>
  </div>

  <section class="workbench">
	<home-navigation-rail [navigationCards]="navigationCards" />
	<home-workspace-center
		[bottomTab]="bottomTab()"
		[tabItems]="tabItems"
		[boardColumns]="boardColumns"
		[boardRows]="boardRows"
		[desktopBackendBaseUrl]="desktopBackendBaseUrl()"
		[desktopBackendReachable]="desktopBackendReachable()"
		[desktopBackendManaged]="desktopBackendManaged()"
		[desktopBackendError]="desktopBackendError()"
		[enabledModelCount]="enabledModelCount()"
		[boardValidationText]="boardValidationText()"
		[libraryValidationText]="libraryValidationText()"
		[hardwareCategories]="hardwareCategories()"
		[securitySummary]="securitySummary()"
		[appLanguage]="appLanguage()"
		[appThemeMode]="appThemeMode()"
		[devmodeEnabled]="devmodeEnabled()"
		[devmodeAutoSave]="devmodeAutoSave()"
		[appAiChatMode]="appAiChatMode()"
		[appSelectedModel]="appSelectedModel()"
		[recentModelProjectCount]="recentModelProjectCount()"
		[toolbarAppCount]="toolbarAppCount()"
		[visibleToolbarAppCount]="visibleToolbarAppCount()"
		[quickSendCount]="quickSendCount()"
		[skippedVersionCount]="skippedVersionCount()"
		[serialBaudRate]="serialBaudRate()"
		[serialAutoScroll]="serialAutoScroll()"
		[serialInputHexMode]="serialInputHexMode()"
		[serialConnectBaudRate]="serialConnectBaudRate()"
		[recentProjectCount]="recentProjectCount()"
		[onboardingCompleted]="onboardingCompleted()"
		[blocklyOnboardingCompleted]="blocklyOnboardingCompleted()"
		[ailyChatOnboardingCompleted]="ailyChatOnboardingCompleted()"
		[previewSelectedLanguage]="previewSelectedLanguage()"
		[previewThemeMode]="previewThemeMode()"
		[previewDevmodeEnabled]="previewDevmodeEnabled()"
		[previewDevmodeAutoSave]="previewDevmodeAutoSave()"
		[previewSerialPort]="previewSerialPort()"
		[previewAiChatMode]="previewAiChatMode()"
		[previewToolbarAppCount]="previewToolbarAppCount()"
		[previewQuickSendCount]="previewQuickSendCount()"
		[previewSkippedVersionCount]="previewSkippedVersionCount()"
		[defaultToolbarAppCount]="defaultToolbarAppCount()"
		[mergedToolbarOrderCount]="mergedToolbarOrderCount()"
		[toggledToolbarAppCount]="toggledToolbarAppCount()"
		[resetToolbarAppCount]="resetToolbarAppCount()"
		[addedRecentProjectCount]="addedRecentProjectCount()"
		[removedRecentProjectCount]="removedRecentProjectCount()"
		[previewAilyChatOnboardingCompleted]="previewAilyChatOnboardingCompleted()"
		[addedRecentModelProjectCount]="addedRecentModelProjectCount()"
		[removedRecentModelProjectCount]="removedRecentModelProjectCount()"
		(refresh)="refreshDesktopBackendStatus(); refreshCoreDerivedState()"
		(startBackend)="ensureDesktopBackendStarted()"
		(useDarkMode)="useDarkMode()"
		(bottomTabChange)="bottomTab.set($event)"
	/>
	<home-inspector-rail [inspectorCards]="inspectorCards" />
  </section>
</app-shell>
