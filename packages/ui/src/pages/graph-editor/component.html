<section class="graph-page">
	<graph-editor-frame-panel [state]="state()" [desktopAvailable]="!!desktop" (chooseProjectPath)="chooseProjectPath()" />

	<graph-editor-workspace-panel
		[state]="state()"
		[boards]="boards"
		[loading]="loading()"
		[error]="error()"
		[graphJson]="graphJson()"
		[graphJsonDirty]="graphJsonDirty()"
		[graphJsonError]="graphJsonError()"
		[awsContent]="awsContent()"
		[awsDirty]="awsDirty()"
		[cloudAuthToken]="cloudAuthToken()"
		[pinmapHints]="pinmapHints()"
		[pinmapId]="pinmapId()"
		[pinmapJson]="pinmapJson()"
		[pinmapJsonError]="pinmapJsonError()"
		[pinmapSaveBusy]="pinmapSaveBusy()"
		[pinmapTemplateProtocol]="pinmapTemplateProtocol()"
		[pinmapTemplateJson]="pinmapTemplateJson()"
		[syncBusy]="syncBusy()"
		[saveMessage]="saveMessage()"
		(cloudAuthTokenChange)="updateCloudAuthToken($event)"
		(pinmapTemplateProtocolChange)="updatePinmapTemplateProtocol($event)"
		(pinmapIdChange)="updatePinmapId($event)"
		(pinmapJsonChange)="updatePinmapJson($event)"
		(graphJsonChange)="updateGraphJson($event)"
		(awsContentChange)="updateAwsContent($event)"
		(usePinmapId)="usePinmapId($event)"
		(usePinmapVariant)="usePinmapVariant($event)"
		(syncCloudPinmaps)="syncCloudPinmaps()"
		(savePinmap)="savePinmap()"
		(saveGraph)="saveGraph()"
		(saveAws)="saveAws()"
	/>
</section>
