<section class="graph-page">
  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Graph Editor</p>
        <h2>{{ state().title }}</h2>
      </div>
      <span hlmBadge variant="secondary">{{ state().origin }}</span>
    </header>

    <p class="summary">{{ state().url }}</p>
    <iframe class="frame" [src]="state().frameUrl" [title]="state().title"></iframe>
  </article>

  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Workspace Files</p>
        <h2>Connection Artifacts</h2>
      </div>
    </header>

    <div class="file-grid">
      <div class="file-card">
        <span>JSON</span>
        <strong>{{ state().jsonPath || 'loading...' }}</strong>
      </div>
      <div class="file-card">
        <span>AWS</span>
        <strong>{{ state().awsPath || 'loading...' }}</strong>
      </div>
    </div>

    <div class="badge-row">
      @for (board of boards; track board.name) {
        <span hlmBadge>{{ board.displayName }}</span>
      }
    </div>
  </article>
</section>
