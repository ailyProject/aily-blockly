<section class="graph-page">
  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Graph Editor</p>
        <h2>Connection Overview</h2>
      </div>
    </header>

    <div class="badge-row">
      @for (item of connectivityCategories(); track item.name) {
        <span hlmBadge>{{ item.name }} {{ item.count }}</span>
      }
    </div>
  </article>

  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Interfaces</p>
        <h2>Signal Families</h2>
      </div>
    </header>

    <div class="badge-row">
      @for (item of interfaceCategories(); track item.name) {
        <span hlmBadge variant="outline">{{ item.name }} {{ item.count }}</span>
      }
    </div>
  </article>
</section>
