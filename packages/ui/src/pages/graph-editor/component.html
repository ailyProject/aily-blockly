<section class="graph-page">
  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Graph Editor</p>
        <h2>{{ state().title }}</h2>
      </div>
      <span hlmBadge variant="secondary">{{ state().origin }}</span>
    </header>

    <p class="summary">{{ state().url }}</p>
    <iframe class="frame" [src]="state().frameUrl" [title]="state().title"></iframe>
  </article>

  <article hlmCard class="panel">
    <header class="panel-header">
      <div>
        <p class="eyebrow">Boards</p>
        <h2>Attached Workspace Targets</h2>
      </div>
    </header>

    <div class="badge-row">
      @for (board of boards; track board.name) {
        <span hlmBadge>{{ board.displayName }}</span>
      }
    </div>
  </article>
</section>
