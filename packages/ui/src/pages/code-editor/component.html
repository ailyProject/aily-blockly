@if (state(); as result) {
<section class="code-page">
	<code-editor-project-panel
		[recentProjects]="result.recentProjects"
		[projectPath]="projectPath()"
		[buildFailed]="buildResult()?.success === false"
		[projectReloadMessage]="projectReloadMessage()"
		[projectReloadBusy]="projectReloadBusy()"
		(projectPathChange)="pageActions.updateProjectPathValue($event)"
		(projectSelect)="pageActions.chooseProject($event)"
		(reloadProjectState)="pageActions.reloadProjectState()"
	/>
	<code-editor-build-panel
		[runtimeInfo]="runtimeInfo()"
		[state]="state()"
		[serialPort]="serialPort()"
		[sourceCode]="sourceCode()"
		[buildPlan]="buildPlan()"
		[buildResult]="buildResult()"
		[uploadPlan]="uploadPlan()"
		[bleUploadPlan]="bleUploadPlan()"
		[uploadResult]="uploadResult()"
		[bleDevice]="bleDevice()"
		[bleDevices]="bleDevices()"
		[bleUploadProgress]="bleUploadProgress()"
		[bleBridgeAvailable]="bleBridgeAvailable()"
		[buildError]="buildError()"
		[buildBusy]="buildBusy()"
		[uploadBusy]="uploadBusy()"
		(serialPortChange)="pageActions.updateSerialPortValue($event)"
		(sourceCodeChange)="pageActions.updateSourceCode($event)"
		(refreshPlan)="pageActions.refreshPlan()"
		(runBuild)="pageActions.runBuild()"
		(runUpload)="pageActions.runUpload()"
		(selectBleDevice)="pageActions.selectBleDevice()"
		(reconnectBleDevice)="pageActions.reconnectBleDevice()"
		(prepareBleUpload)="pageActions.prepareBleUpload()"
		(runBleUpload)="pageActions.runBleUpload()"
		(selectVisibleBleDevice)="pageActions.selectVisibleBleDevice($event)"
	/>
</section>
}
