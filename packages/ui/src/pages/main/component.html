<div class="main-window-box">
	<header class="header-box" [class.darwin]="isMac">
		<div class="menu no-drag">
			<button class="btn" type="button" (click)="navigateToGuide()" title="Menu">
				<i class="fa-regular fa-bars"></i>
			</button>
		</div>

		@if (!isGuideRoute) {
		<button class="board no-drag" type="button" (click)="navigateToProjectOpen()">
			workspace (-)
			<span class="down"><ng-icon name="lucideChevronDown"></ng-icon></span>
		</button>
		}

		<div class="null-box drag" (dblclick)="toggleWindowMaximize()"></div>

		<div class="project-box">{{ currentProjectLabel }}</div>

		<div class="toolbox no-drag">
			<div class="zone">
				<button class="btn ai-btn" type="button" (click)="navigateToProjectOpen()" title="Serial">
					<i class="fa-light fa-monitor-waveform"></i>
				</button>
				<button class="btn ai-btn" type="button" (click)="navigateToChat()" title="AI Assistant">
					<i class="fa-light fa-star-christmas"></i>
					<span class="more">AI</span>
				</button>
				<button class="btn" type="button" (click)="navigateToPlayground()" title="Cloud Space">
					<i class="fa-light fa-album-collection"></i>
				</button>
				<button class="btn" type="button" title="User Center">
					<i class="fa-light fa-user"></i>
				</button>
			</div>
			<div class="divider"></div>
			<div class="zone">
				<button class="btn" type="button" (click)="navigateToGuide()" title="App Store">
					<i class="fa-light fa-grid-2-plus"></i>
				</button>
			</div>
		</div>

		<div class="win-btns no-drag">
			<button class="btn minimize" type="button" (click)="minimizeWindow()" title="Minimize">
				<i class="fa-regular fa-minus"></i>
			</button>
			<button class="btn maximize" type="button" (click)="toggleWindowMaximize()" title="Maximize">
				@if (isWindowMaximized()) {
				<i class="fa-regular fa-window-restore"></i>
				} @else {
				<i class="fa-regular fa-window-maximize"></i>
				}
			</button>
			<button class="btn close" type="button" (click)="closeWindow()" title="Close">
				<i class="fa-regular fa-xmark"></i>
			</button>
		</div>
	</header>

	<div class="content-box">
		<div class="middle-box">
			<router-outlet />
		</div>
	</div>

	<footer class="footer-box">
		<button class="btn no-drag" type="button" (click)="openBottomLog()" title="Log">
			<i class="fa-light fa-square-list"></i>
		</button>
		<button class="btn no-drag" type="button" (click)="openBottomTerminal()" title="Terminal">
			<i class="fa-light fa-square-terminal"></i>
		</button>
	</footer>
</div>
