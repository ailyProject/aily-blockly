<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>登录项目广场</title>
  <link rel="stylesheet" href="hub-consent.css">
  <script defer src="hub-consent-page.js"></script>
</head>
<body>
  <main class="authorization-page">
    <section class="authorization-card" role="dialog" aria-labelledby="authorization-title" aria-describedby="authorization-description">
      <button id="close" class="close-button" type="button" aria-label="取消授权并关闭"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
      <div class="authorization-body">
        <header class="authorization-header">
          <div class="connection-mark" aria-hidden="true">
            <span class="app-mark aily-mark"><img src="hub-consent-aily.jpg" alt="" width="38" height="38"></span>
            <span class="connection-line"></span>
            <svg class="connection-arrow" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
            <span class="connection-line"></span>
            <span class="app-mark hub-mark"><svg viewBox="0 0 28 28" fill="none"><path d="m14 4 10 6v8l-10 6-10-6v-8l10-6Z" /><path d="m4 10 10 6 10-6M14 16v8M9 7l10 6" /></svg></span>
          </div>
          <h1 id="authorization-title">登录项目广场</h1>
          <p id="authorization-description">使用当前 aily 账号，继续分享你的创造。</p>
        </header>

        <div class="account">
          <span id="account-avatar" class="account-avatar" aria-hidden="true">A</span>
          <div class="account-copy"><strong id="account-name">正在读取账号…</strong><span id="account-email"></span></div>
          <span class="account-status"><i></i><span id="account-site">当前账号</span></span>
        </div>
        <p class="target-origin">授权给 <span>aily Project</span><span class="target-divider">·</span><span id="target-origin"></span></p>

        <section class="permissions" aria-labelledby="permissions-title">
          <h2 id="permissions-title">项目广场需要以下权限</h2>
          <ul>
            <li>
              <span class="permission-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.25" /><path d="M5 20v-2a7 7 0 0 1 14 0v2" /></svg></span>
              <div><h3>基本资料</h3><p>读取昵称和头像，展示你的作者身份</p></div>
              <svg class="permission-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 12 4 4 8-8" /></svg>
            </li>
            <li>
              <span class="permission-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 18H6a4 4 0 0 1-.6-7.95A6.5 6.5 0 0 1 18 9a4.5 4.5 0 0 1 .5 9H17M12 13v8m-3-3 3 3 3-3" /></svg></span>
              <div><h3>云工程读取</h3><p>查看、读取和复制你本人的云工程</p></div>
              <svg class="permission-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 12 4 4 8-8" /></svg>
            </li>
          </ul>
        </section>

        <div class="privacy-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 8 3v6c0 4.5-4.5 7.5-8 9-3.5-1.5-8-4.5-8-9V6l8-3Z" /><path d="m8.5 12 2.5 2.5 4.5-5" /></svg>
          <p>不含工程修改、删除、支付及账号安全权限。</p>
        </div>
        <p class="expiry-note">授权连接连续 30 天未使用时需重新确认，可随时撤销。</p>
        <p id="error" class="authorization-error" role="alert" hidden></p>
      </div>
      <footer class="authorization-actions">
        <button id="cancel" class="cancel-button" type="button">取消</button>
        <button id="allow" class="allow-button" type="button" disabled>允许并登录 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg></button>
      </footer>
    </section>
  </main>
</body>
</html>
